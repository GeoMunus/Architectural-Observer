# Publishes the nullspace/ directory to GitHub Pages, so the app can be
# opened on a phone without running a server anywhere. The directory is
# uploaded as the site root, which keeps the URL short and makes the app's
# relative paths (style.css, src/ui/app.js) resolve unchanged.
name: Deploy NULLSPACE to Pages

on:
  push:
    branches:
      - main
      - claude/ai-discord-alternative-lv6zil
    paths:
      - "nullspace/**"
      - ".github/workflows/pages.yml"
  # Lets the deploy be re-run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the last
# push always ends up being the version that is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on via the API if it is not already,
      # saving a trip into the repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nullspace

      - id: deployment
        uses: actions/deploy-pages@v4
